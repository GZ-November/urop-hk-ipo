name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax (py_compile)
        run: |
          python -m py_compile run.py
          find "Data Collecting Templates/News/prospectus_pipeline/src" -name "*.py" -exec python -m py_compile {} +
          find "Data Collecting Templates/News/prospectus_pipeline/tools" -name "*.py" -exec python -m py_compile {} +

      - name: Run automated test suite
        run: |
          python -m unittest discover -s "Data Collecting Templates/News/prospectus_pipeline/tests" -v

      - name: Verify CLI entry point
        run: |
          python run.py --help
