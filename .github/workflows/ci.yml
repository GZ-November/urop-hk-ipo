name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python 3.11 on Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax (py_compile)
        run: |
          python -m py_compile run.py
          find "Data Collecting Pipeline/prospectus_pipeline/src" -name "*.py" -exec python -m py_compile {} +
          find "Data Collecting Pipeline/prospectus_pipeline/tools" -name "*.py" -exec python -m py_compile {} +
          find "Data Collecting Pipeline/reports" -name "*.py" -exec python -m py_compile {} +

      - name: Run automated test suite
        run: |
          python -m unittest discover -s "Data Collecting Pipeline/prospectus_pipeline/tests" -v

      - name: Verify CLI entry point
        run: |
          python run.py --help
