name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python 3.11 on Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install development checks
        run: |
          pip install flake8

      - name: Lint, pipeline and analysis tests, registry consistency
        run: make check-code PYTHON=python

      - name: Set up dashboard verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify offline dashboard snapshot and interactions
        run: make dashboard-check PYTHON=python

      - name: Verify workspace navigation
        run: |
          make workspace-check PYTHON=python
          python tools/build_file_index.py
          git diff --exit-code -- 00_START_HERE.html

      - name: Verify CLI entry point
        run: |
          python run.py --help
