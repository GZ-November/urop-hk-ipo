name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Locked environment (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependency profiles
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --python "${{ matrix.python }}" --extra analysis --extra dev
      - name: Verify environment and CLI
        run: |
          .venv/bin/python run.py doctor
          .venv/bin/python run.py --help
      - name: Lint, pipeline and analysis tests, registry consistency
        run: make check-code
