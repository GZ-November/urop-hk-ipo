[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectus-pipeline"
version = "2.0.0"
description = "Automated Extraction, Deterministic Validation, and Hash-Bound Excel Delivery Pipeline for HK IPOs"
authors = [{ name = "HK IPO UROP Research Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pymupdf>=1.23.0",
    "xlrd>=2.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
