# Supplemental Main Board new-listing entries for 2026 beyond NLR2026_Eng.xlsx coverage.
#
# NLR2026_Eng.xlsx (retrieved 2026-10-01) is titled "Year 2026 (up to 29 September 2026)"
# and contains 115 candidate rows (112 ordinary Main Board IPOs after the three known
# exclusions: 7489 introduction, 6051 GEM transfer, 3774 GEM transfer).  The official
# HKEX monthly report for September 2026 (published 2026-09-30) counts 116 Main Board
# newly listed companies year-to-date, including 2 GEM-to-Main-Board transfers, i.e.
# 113 ordinary Main Board IPOs.  113 - 112 = 1 issuer is beyond the annual report's
# printed coverage date; it is listed here with its own official sources until the
# annual report is refreshed to include it.
#
# Rules for entries in this file:
#   - listing_date must be after the annual report's printed coverage date;
#   - every entry carries at least one official HKEX source URL and a retrieved date;
#   - entries are merged by build_cohort_workbook only for requested intervals that
#     extend past the annual report's coverage (see listing_reports.load_supplement).

