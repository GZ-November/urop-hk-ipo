[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urop-hk-ipo"
version = "2.0.0"
description = "Automated Extraction, Deterministic Validation, and Econometric Research Toolkit for HKEX IPOs"
authors = [{ name = "UROP HK IPO Research Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["Data Collecting Templates/News/prospectus_pipeline/tests"]
python_files = ["test_*.py"]
