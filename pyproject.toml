[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urop-hk-ipo"
version = "2.0.0"
description = "Evidence-linked Hong Kong IPO datasets and reproducible research on issuance costs, investor allocation, pricing and aftermarket outcomes"
authors = [{ name = "UROP HK IPO Research Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pymupdf>=1.23.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/prospectus_pipeline/tests", "analysis/tests"]
python_files = ["test_*.py"]

# This is a source-checkout CLI; installing the project installs its dependency
# profiles. Runtime datasets and local scratch directories are never packages.
[tool.setuptools]
packages = []
py-modules = []
